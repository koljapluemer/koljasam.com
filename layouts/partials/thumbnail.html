{{- $path := strings.TrimPrefix "/" .thumbnail -}}
{{- with resources.Get $path -}}
  {{- $thumb := . -}}
  {{- if gt .Width 800 -}}
    {{- $thumb = .Resize "800x webp q75" -}}
  {{- else -}}
    {{- $thumb = .Process "webp q75" -}}
  {{- end -}}
  <img class="card-thumbnail" src="{{ $thumb.RelPermalink }}" width="{{ $thumb.Width }}" height="{{ $thumb.Height }}" loading="lazy" alt="">
{{- end -}}
